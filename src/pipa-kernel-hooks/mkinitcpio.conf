# vim:set ft=sh:

# Xiaomi Pad 6 Pipa mkinitcpio conf
# Updates are made through pacman, modify main config if neccessary

MODULES+=(
# display, backlight, touch, keyboard, wireless charger (same early set as postmarketOS modules-initfs)
panel_novatek_nt36532
ktz8866
nt36523_ts
nanosic_803
nu1665
spi_geni_qcom
# remoteprocs (ADSP/CDSP/SLPI firmware is baked in by the pipafw hook)
qcom_common
qcom_pil_info
qcom_q6v5
qcom_q6v5_pas
qcom_pd_mapper
i2c_qcom_cci
qcom_camss
venus_core
venus_dec
venus_enc
snd_soc_sm8250
snd_soc_qcom_common
snd_soc_qcom_sdw
btqca
hci_uart
bluetooth
ath11k_pci
ath11k
)

HOOKS+=(pipafw)

# COMPRESSION
# Initramfs is configured to use gzip in pipa,
# If you wish to change this, check kernel config for support.
COMPRESSION="gzip"
